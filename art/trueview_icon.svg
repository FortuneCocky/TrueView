<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="room" cx="50%" cy="44%" r="70%">
      <stop offset="0" stop-color="#3a4038"/>
      <stop offset="0.5" stop-color="#181c19"/>
      <stop offset="1" stop-color="#050606"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="46%" r="70%">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.85"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#58616a"/>
      <stop offset="0.2" stop-color="#22272b"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </linearGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.08 0"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="120"/></clipPath>
    <!-- a rifle's front end, first person, from the lower right to the aim point -->
    <g id="barrel">
      <polygon points="600,556 652,564 656,610 604,604" fill="#0a0c0e" stroke="#3c4349" stroke-width="3"/>
      <polygon points="648,556 1024,624 1024,1000 648,618" fill="url(#metal)"/>
      <polygon points="820,610 1024,650 1024,700 830,650" fill="#0e1012"/>
      <path d="M820,610 L1024,650" stroke="#8a939a" stroke-width="3" opacity="0.6"/>
      <path d="M648,556 L1024,624" stroke="#b4bcc2" stroke-width="4" opacity="0.75"/>
      <path d="M670,566 L820,594" stroke="#5f686f" stroke-width="4" stroke-dasharray="9 11" opacity="0.8"/>
    </g>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#room)"/>
    <!-- far doorway light -->
    <rect x="452" y="300" width="120" height="250" fill="#4a4636" opacity="0.6"/>
    <ellipse cx="512" cy="430" rx="230" ry="200" fill="#f4e2b8" opacity="0.06" filter="url(#blur)"/>

    <!-- the gun trails the view -->
    <use href="#barrel" transform="rotate(-5 1024 900) translate(-30 -22)" opacity="0.14" filter="url(#blur)"/>
    <use href="#barrel"/>

    <!-- the deadzone -->
    <g transform="translate(512 440)">
      <circle r="250" fill="none" stroke="#e8b04a" stroke-width="5" stroke-dasharray="26 20" opacity="0.8"/>
      <circle r="250" fill="none" stroke="#e8b04a" stroke-width="18" opacity="0.08"/>
      <path d="M-26,0 H-8 M8,0 H26 M0,-26 V-8 M0,8 V26" stroke="#eef0f2" stroke-width="5" opacity="0.9"/>
      <path d="M-130,-110 C-50,-190 90,-150 100,-50 C108,30 70,90 96,136" fill="none" stroke="#e8b04a" stroke-width="6" stroke-dasharray="3 18" stroke-linecap="round" opacity="0.8"/>
      <circle cx="-130" cy="-110" r="7" fill="#e8b04a" opacity="0.25"/>
      <circle cx="20" cy="-158" r="9" fill="#e8b04a" opacity="0.4"/>
      <circle cx="100" cy="-50" r="11" fill="#e8b04a" opacity="0.55"/>
      <circle cx="96" cy="136" r="18" fill="#ffcf6e" filter="url(#glow)"/>
      <circle cx="96" cy="136" r="38" fill="none" stroke="#ffcf6e" stroke-width="4" opacity="0.65"/>
    </g>

    <rect width="1024" height="1024" fill="url(#lens)"/>
    <rect width="1024" height="1024" filter="url(#grain)"/>
    <rect width="1024" height="1024" fill="url(#scan)"/>

    <!-- bodycam frame -->
    <circle cx="112" cy="112" r="20" fill="#e0342b" filter="url(#glow)"/>
    <text x="148" y="128" font-family="Consolas, monospace" font-size="46" letter-spacing="4" fill="#eef0f2">REC</text>
    <g stroke="#eef0f2" stroke-width="7" fill="none" opacity="0.65" stroke-linecap="square">
      <path d="M840,64 H960 V184"/><path d="M64,840 V960 H184"/><path d="M960,840 V960 H840"/>
    </g>

    <!-- name -->
    <text x="512" y="910" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="128" font-weight="700" letter-spacing="10" fill="#000" opacity="0.65" filter="url(#blur)">TRUE VIEW</text>
    <text x="512" y="902" text-anchor="middle" font-family="Bahnschrift, 'Segoe UI', sans-serif" font-size="128" font-weight="700" letter-spacing="10" fill="#f2f3f4">TRUE VIEW</text>
    <rect x="372" y="928" width="280" height="7" fill="#e8b04a"/>
  </g>
</svg>
